<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>주간 학부모 리포트 편집기</title>
    <style>
      :root {
        --bg: #f5f5f5;
        --panel: #ffffff;
        --ink: #1f2937;
        --muted: #6b7280;
        --line: #e5e7eb;
        --navy: #163a63;
        --navy-2: #102f52;
        --blue: #1f5fae;
        --blue-soft: #eaf3ff;
        --surface: #f8fafc;
        --surface-2: #f1f5f9;
        --red: #e14d57;
        --red-soft: #fff0f2;
        --green: #16a36b;
        --orange: #f28c28;
        --text-headline: 18px;
        --text-title: 20px;
        --text-body: 13px;
        --text-caption: 11px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
        font-size: var(--text-body);
        line-height: 1.45;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      .app-header {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(8px);
      }

      .header-inner {
        max-width: 1600px;
        margin: 0 auto;
        padding: 14px 18px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: var(--text-headline);
        font-weight: 850;
        letter-spacing: 0;
      }

      .app-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .app-brand-logo {
        width: 34px;
        height: 34px;
        object-fit: contain;
        flex: 0 0 auto;
      }

      .page-title {
        justify-self: center;
        color: var(--ink);
        font-size: var(--text-title);
        font-weight: 900;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .header-actions,
      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .header-actions {
        justify-content: flex-end;
      }

      @media (max-width: 1180px) {
        .header-inner {
          grid-template-columns: 1fr;
          justify-items: start;
        }

        .page-title {
          justify-self: start;
          font-size: 18px;
        }

        .header-actions {
          justify-content: flex-start;
        }
      }

      .pill {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 10px;
        background: #f8fafc;
        color: var(--muted);
        font-size: var(--text-caption);
        font-weight: 700;
        white-space: nowrap;
      }

      .shell {
        max-width: 1600px;
        margin: 0 auto;
        height: calc(100vh - 63px);
        min-height: 800px;
        padding: 12px 14px;
        display: grid;
        grid-template-columns: 300px minmax(680px, 1fr) 330px;
        gap: 12px;
      }

      .panel {
        min-height: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .panel-head {
        min-height: 45px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .panel-head h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 850;
      }

      .panel-body {
        padding: 12px;
        overflow: auto;
      }

      .setup {
        border-bottom: 1px solid var(--line);
      }

      .setup summary {
        cursor: pointer;
        padding: 10px 12px;
        color: var(--navy);
        font-size: var(--text-body);
        font-weight: 800;
      }

      .setup-body {
        padding: 0 12px 12px;
      }

      .upload-row {
        display: grid;
        grid-template-columns: 112px 1fr;
        gap: 8px;
        align-items: center;
      }

      .upload-button {
        height: 32px;
        border: 1px solid var(--blue);
        border-radius: 6px;
        display: grid;
        place-items: center;
        background: var(--blue);
        color: #fff;
        font-size: var(--text-body);
        font-weight: 800;
        cursor: pointer;
      }

      .analyze-button {
        width: 100%;
        height: 38px;
        border-color: var(--navy);
        background: var(--navy);
        color: #fff;
        font-size: 14px;
        font-weight: 850;
      }

      .upload-button input {
        display: none;
      }

      .file-name {
        height: 32px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 9px;
        display: flex;
        align-items: center;
        background: var(--surface-2);
        color: var(--muted);
        font-size: var(--text-body);
        font-weight: 700;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .filters {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        display: grid;
        gap: 8px;
      }

      .filter-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .course-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .course-tab {
        height: 32px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: #344054;
        font-size: var(--text-body);
        font-weight: 800;
      }

      .course-tab.active {
        border-color: var(--blue);
        background: var(--blue-soft);
        color: var(--blue);
        box-shadow: inset 0 0 0 1px var(--blue);
      }

      .field {
        margin-bottom: 10px;
      }

      label {
        display: block;
        margin-bottom: 4px;
        font-size: var(--text-caption);
        font-weight: 800;
        color: #344054;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 7px 9px;
        background: #fff;
        color: var(--ink);
        font-size: var(--text-body);
      }

      textarea {
        min-height: 78px;
        resize: vertical;
        line-height: 1.5;
      }

      input[type="file"] {
        background: #fbfcfe;
        border-style: dashed;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      button {
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: #344054;
        cursor: pointer;
        font-size: var(--text-body);
        font-weight: 750;
        padding: 0 10px;
      }

      button.primary {
        border-color: var(--blue);
        background: var(--blue);
        color: #fff;
      }

      button.danger {
        border-color: #f4c7cd;
        background: var(--red-soft);
        color: #ad2634;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .student-list {
        min-height: 0;
        flex: 1;
        overflow: auto;
        border-top: 1px solid var(--line);
      }

      .student-item {
        width: 100%;
        height: auto;
        min-height: 46px;
        border: 0;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        padding: 7px 11px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        text-align: left;
        background: #fff;
      }

      .student-item.active {
        background: var(--blue-soft);
        box-shadow: inset 3px 0 0 var(--blue);
      }

      .student-name {
        display: block;
        font-size: 13px;
        font-weight: 850;
      }

      .student-sub {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: var(--text-caption);
        font-weight: 500;
      }

      .status {
        border-radius: 999px;
        padding: 4px 7px;
        color: var(--muted);
        background: #f3f6fa;
        font-size: 10px;
        font-weight: 800;
        white-space: nowrap;
      }

      .status.saved {
        color: #087443;
        background: #e8f7ef;
      }

      .status.edited {
        color: #9a5b00;
        background: #fff4dc;
      }

      .status.exported {
        color: #1b4b9b;
        background: #e8f0ff;
      }

      .preview-wrap {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 14px;
        background: #e9edf3;
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }

      .preview-wrap .a4-report {
        transform: scale(0.64);
        transform-origin: top left;
        margin-right: -404px;
        margin-bottom: -286px;
      }

      .report-page {
        width: 1120px;
        min-height: 790px;
        margin: 0 auto;
        padding: 26px;
        background: #fff;
        box-shadow: 0 10px 28px rgba(23, 32, 51, 0.18);
        color: var(--ink);
      }

      .preview-wrap .concept-report {
        transform: scale(0.74);
        transform-origin: top left;
        margin-right: -206px;
        margin-bottom: -292px;
      }

      .report-page.concept-report {
        width: 794px;
        height: 1123px;
        min-height: 1123px;
        padding: 37px 53px 33px;
        overflow: hidden;
        background: #ffffff;
        box-shadow: 0 8px 24px rgba(15, 47, 83, 0.10);
        border: 1px solid #e6eaf0;
      }

      .concept-report .concept-header {
        display: block;
        padding-bottom: 11px;
        border-bottom: 4px solid var(--navy);
      }

      .concept-report .brand-lockup {
        display: none;
        align-items: center;
        gap: 7px;
      }

      .concept-report .brand-name {
        color: var(--blue);
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0;
      }

      .concept-report .course-chip {
        margin-left: 2px;
        padding-left: 8px;
        border-left: 1px solid #cfd7e6;
        color: #52627a;
        font-size: 11px;
        font-weight: 800;
      }

      .concept-report .eyebrow {
        color: var(--blue);
        font-size: 12px;
        font-weight: 800;
      }

      .concept-report .concept-title {
        margin: 0;
        color: #111827;
        font-size: 25px;
        line-height: 1.15;
        font-weight: 800;
        text-align: center;
        letter-spacing: 0;
      }

      .concept-report .concept-meta {
        min-width: 0;
        display: grid;
        grid-template-columns: 72px 1fr;
        gap: 0;
        border: 1px solid var(--line);
        border-bottom: 0;
        font-size: 11px;
        color: var(--muted);
      }

      .concept-report .concept-meta span,
      .concept-report .concept-meta strong {
        min-height: 24px;
        padding: 5px 7px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
      }

      .concept-report .concept-meta span {
        background: var(--surface-2);
        color: var(--navy);
        font-weight: 800;
      }

      .concept-report .concept-meta strong {
        background: #ffffff;
        color: var(--ink);
        font-weight: 500;
      }

      .concept-report .concept-summary {
        display: grid;
        grid-template-columns: 1.28fr 1fr 1fr 1fr;
        gap: 8px;
        margin: 12px 0 8px;
        padding-bottom: 9px;
        border-bottom: 1px solid var(--line);
      }

      .concept-report .metric {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px 11px;
        background: linear-gradient(180deg, #f7faff 0%, #ffffff 100%);
        box-shadow: inset 0 4px 0 #dbeafe;
      }

      .concept-report .metric span {
        display: block;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }

      .concept-report .metric strong {
        display: block;
        margin-top: 3px;
        color: var(--ink);
        font-size: 22px;
        line-height: 1;
      }

      .concept-report .metric small {
        display: block;
        margin-top: 5px;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.25;
      }

      .concept-report .concept-layout {
        display: grid;
        grid-template-columns: 1fr 0.95fr;
        gap: 10px;
      }

      .concept-report .concept-section {
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
        background: #fff;
      }

      .concept-report .concept-section + .concept-section {
        margin-top: 9px;
      }

      .concept-report .concept-section h2 {
        position: relative;
        margin: 0;
        padding: 8px 10px 7px 18px;
        color: #ffffff;
        background: var(--navy);
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .concept-report .concept-section h2::before {
        content: "";
        position: absolute;
        left: 10px;
        top: 9px;
        bottom: 9px;
        width: 3px;
        border-radius: 999px;
        background: #75a7ea;
      }

      .concept-report .split-mini-sections {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .concept-report .split-mini-sections .concept-section {
        min-width: 0;
      }

      .concept-report .split-mini-sections .concept-section + .concept-section {
        margin-top: 0;
      }

      .concept-report .concept-body {
        padding: 10px;
        background: #ffffff;
      }

      .concept-report .notice {
        display: grid;
        grid-template-columns: 62px 1fr;
        gap: 8px;
        align-items: center;
      }

      .concept-report .grade {
        width: 56px;
        height: 50px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        background: var(--blue-soft);
        border: 2px solid var(--blue);
        color: var(--blue);
        font-size: 25px;
        font-weight: 800;
      }

      .concept-report .comment {
        margin: 0;
        color: #344054;
        font-size: 12px;
        line-height: 1.55;
      }

      .concept-report .bar-row {
        display: grid;
        grid-template-columns: 70px 1fr 48px;
        gap: 8px;
        align-items: center;
        margin: 8px 0;
        font-size: 11px;
      }

      .concept-report .concept-chart {
        height: 106px;
        padding: 7px 8px 4px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
        align-items: end;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(to top, #edf0f4 1px, transparent 1px) 0 0 / 100% 25%;
      }

      .concept-report .bars {
        display: flex;
        justify-content: center;
        gap: 9px;
        height: 100%;
        align-items: end;
      }

      .concept-report .bars.single {
        display: grid;
        place-items: end center;
        position: relative;
      }

      .concept-report .bar-stack {
        height: 100%;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: end;
      }

      .concept-report .bar-value {
        position: absolute;
        bottom: calc(var(--bar-height, 0%) + 3px);
        color: var(--muted);
        font-size: 9px;
        font-weight: 800;
      }

      .concept-report .bar-stack.student .bar-value {
        color: var(--blue);
      }

      .concept-report .bar-stack.class-avg .bar-value {
        color: #7b8798;
      }

      .concept-report .vbar {
        width: 18px;
        border-radius: 4px 4px 0 0;
      }

      .concept-report .vbar.student {
        width: 22px;
        background: var(--blue);
      }

      .concept-report .vbar.class-avg {
        width: 18px;
        background: #c7ced8;
      }

      .concept-report .chart-labels {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
        padding: 5px 8px 8px;
        color: var(--muted);
        text-align: center;
        font-size: 10px;
      }

      .concept-report .legend {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 10px;
      }

      .concept-report .homework-legend {
        margin: 0 0 8px;
      }

      .concept-report .homework-chart {
        height: 98px;
        padding-top: 12px;
      }

      .concept-report .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 4px;
        border-radius: 2px;
        vertical-align: -1px;
      }

      .concept-report .dot.student {
        background: var(--blue);
      }

      .concept-report .dot.class-avg {
        background: #c7ced8;
      }

      .concept-report .radar {
        display: grid;
        grid-template-columns: 146px 1fr;
        gap: 6px;
        align-items: center;
      }

      .concept-report .radar-box {
        width: 138px;
        height: 138px;
        position: relative;
        margin: 0 auto;
      }

      .concept-report .radar-svg {
        width: 138px;
        height: 138px;
        display: block;
      }

      .concept-report .axis {
        position: absolute;
        color: var(--muted);
        font-size: 9px;
      }

      .concept-report .axis.top { top: 1px; left: 54px; }
      .concept-report .axis.right { top: 62px; right: 0; }
      .concept-report .axis.bottom { bottom: 1px; left: 54px; }
      .concept-report .axis.left { top: 62px; left: 0; }

      .concept-report .mini-table {
        width: 100%;
        height: 100%;
        border-collapse: collapse;
        font-size: 9.8px;
        table-layout: fixed;
      }

      .concept-report .mini-table th,
      .concept-report .mini-table td {
        border-bottom: 1px solid var(--line);
        padding: 0 3px;
        text-align: left;
        vertical-align: middle;
      }

      .concept-report .mini-table th {
        color: #344054;
        background: var(--surface-2);
      }

      .concept-report .questions {
        width: 100%;
        border-collapse: collapse;
        font-size: 9.5px;
      }

      .concept-report .questions th,
      .concept-report .questions td {
        border: 1px solid #dfe4eb;
        padding: 3px 4px;
        line-height: 1.3;
      }

      .concept-report .questions th {
        color: #ffffff;
        background: var(--navy-2);
        font-weight: 800;
      }

      .concept-report .questions .miss {
        background: #fff0f1;
        color: #b4232c;
        font-weight: 800;
      }

      .concept-report .questions .focus {
        background: #eef5ff;
        color: var(--blue);
        font-weight: 800;
      }

      .concept-report .clinic-strip {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 10px;
        align-items: center;
        min-height: 74px;
        padding: 10px 12px;
        background: #ffffff;
        font-size: 11.5px;
        line-height: 1.5;
      }

      .concept-report .clinic-strip.mock-exam {
        display: block;
        min-height: auto;
        padding: 9px;
      }

      .concept-report .clinic-strip.mock-exam .clinic-mark {
        white-space: nowrap;
        font-size: 15px;
        font-weight: 800;
        padding-inline: 8px;
      }

      .concept-report .mock-pair {
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--surface);
      }

      .concept-report .mock-value {
        color: var(--ink);
        font-size: 15px;
        font-weight: 800;
        line-height: 1.25;
        text-align: center;
        word-break: keep-all;
      }

      .concept-report .clinic-state {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .concept-report .clinic-symbol {
        width: 26px;
        height: 26px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--navy);
        font-size: 13px;
        font-weight: 800;
      }

      .concept-report .feedback {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 6px;
        height: 100%;
      }

      .concept-report .domain-section .concept-body {
        min-height: 180px;
      }

      .concept-report .domain-section .mini-table-wrap {
        align-self: stretch;
        display: flex;
      }

      .concept-report .feedback-section .concept-body {
        height: 302px;
      }

      .concept-report .feedback-section .note {
        min-height: 0;
        height: 100%;
        padding: 0;
        overflow: hidden;
        font-size: 10px;
        line-height: 1.3;
      }

      .concept-report .feedback-section .note strong {
        display: block;
        margin: 0;
        padding: 5px 7px 4px;
        border-bottom: 1px solid var(--line);
        background: var(--blue-soft);
        color: var(--navy);
        font-size: 11px;
      }

      .concept-report .feedback-section .note span {
        display: block;
        padding: 6px 7px;
      }

      .concept-report .concept-section.feedback-section {
        margin-top: 3px;
      }

      .concept-report .note {
        min-height: 75px;
        padding: 9px;
        border-radius: 6px;
        background: var(--surface);
        border: 1px solid var(--line);
        font-size: 11px;
        line-height: 1.52;
      }

      .concept-report .note strong {
        display: block;
        margin-bottom: 4px;
        color: var(--navy);
        font-size: 12px;
      }

      .concept-report .concept-footer {
        margin-top: 4px;
        padding-top: 4px;
        border-top: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        font-size: 16px;
      }

      .concept-report .footer-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--navy);

        <div class="preview-wrap">
          <div id="reportRoot" class="report-page">
            <div class="empty">엑셀을 업로드하거나 샘플을 불러오면 리포트가 표시됩니다.</div>
          </div>
        </div>
      </section>

      <aside class="panel">
        <div class="panel-head">
          <h2>코멘트 검수</h2>
          <button id="saveBtn" class="primary" disabled>저장</button>
        </div>
        <div class="panel-body">
          <div class="field">
            <label>종합평가</label>
            <textarea id="commentSummary"></textarea>
          </div>
          <div class="field">
            <label>잘한 점</label>
            <textarea id="commentStrength"></textarea>
          </div>
          <div class="field">
            <label>보완할 점</label>
            <textarea id="commentWeakness"></textarea>
          </div>
          <div class="field">
            <label>다음 학습 방향</label>
            <textarea id="commentNext"></textarea>
          </div>
          <div class="field">
            <label>가정 안내</label>
            <textarea id="commentHome"></textarea>
          </div>
          <div class="field">
            <label id="clinicCommentLabel">클리닉 코멘트</label>
            <textarea id="commentClinic"></textarea>
          </div>
          <div class="toast" id="editToast">학생을 선택하면 코멘트를 수정할 수 있습니다.</div>
        </div>
      </aside>
    </main>

    <div id="printRoot" class="report-batch"></div>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
      if (window.location.protocol === "file:") {
        window.location.replace("http://127.0.0.1:8787/weekly-report");
      }

      const state = {
        analysis: null,
        currentIndex: 0,
        statuses: {},
        filters: {
          search: "",
          status: "",
          overall: "",
          clinic: "",
          sort: "original",
        },
      };

      const $ = (id) => document.getElementById(id);

      const fields = {
        academy: $("academy"),
        reportTitle: $("reportTitle"),
        periodType: $("periodType"),
        courseType: $("courseType"),
        period: $("period"),
        className: $("className"),
        courseName: $("courseName"),
        teacher: $("teacher"),
        testName: $("testName"),
        testDate: $("testDate"),
      };

      const commentFields = {
        summary: $("commentSummary"),
        strength: $("commentStrength"),
        weakness: $("commentWeakness"),
        nextAction: $("commentNext"),
        homeGuide: $("commentHome"),
        clinicComment: $("commentClinic"),
      };

      const filterFields = {
        search: $("studentSearch"),
        status: $("statusFilter"),
        overall: $("overallFilter"),
        clinic: $("clinicFilter"),
        sort: $("sortFilter"),
      };

      function metadataForm(file) {
        const form = new FormData();
        form.append("file", file);
        form.append("academy", fields.academy.value);
        form.append("report_title", fields.reportTitle.value);
        form.append("period_type", fields.periodType.value);
        form.append("course_type", fields.courseType.value);
        form.append("period", fields.period.value);
        form.append("class_name", fields.className.value);
        form.append("course_name", fields.courseName.value);
        form.append("teacher", fields.teacher.value);
        form.append("test_name", fields.testName.value);
        form.append("test_date", fields.testDate.value);
        return form;
      }

      function currentMetadataFromFields() {
        return {
          academy: fields.academy.value.trim(),
          reportTitle: fields.reportTitle.value.trim(),
          periodType: fields.periodType.value,
          courseType: fields.courseType.value,
          period: fields.period.value.trim(),
          className: fields.className.value.trim(),
          courseName: fields.courseName.value.trim(),
          teacher: fields.teacher.value.trim(),
          testName: fields.testName.value.trim(),
          testDate: fields.testDate.value.trim(),
        };
      }

      function applyMetadataFieldsToAnalysis() {
        if (!state.analysis) return;
        state.analysis.metadata = {
          ...(state.analysis.metadata || {}),
          ...currentMetadataFromFields(),
        };
      }

      async function analyzeFile(file) {
        $("uploadToast").textContent = "분석 중입니다...";
        const res = await fetch("/api/weekly/analyze", { method: "POST", body: metadataForm(file) });
        const payload = await res.json();
        if (!res.ok || !payload.ok) {
          throw new Error(payload.error || "분석 실패");
        }
        state.analysis = payload.analysis;
        state.currentIndex = 0;
        state.statuses = {};
        state.filters = { search: "", status: "", overall: "", clinic: "", sort: "original" };
        Object.entries(filterFields).forEach(([key, field]) => {
          field.value = state.filters[key];
        });
        setCourseType(state.analysis.metadata?.courseType || fields.courseType.value || "내신");
        normalizeTeacherMemoPlacement();
        hydrateSavedComments();
        normalizeTeacherMemoPlacement();
        renderAll();
        $("setupDetails").open = false;
        $("uploadToast").textContent = `분석 완료: ${state.analysis.students.length}명`;
      }

      async function loadSample() {
        $("uploadToast").textContent = "샘플 파일을 불러오는 중입니다...";
        const res = await fetch("/api/weekly/download-template");
        const blob = await res.blob();
        const file = new File([blob], "주간_학부모리포트_입력양식_샘플.xlsx", { type: blob.type });
        await analyzeFile(file);
      }

      function storageKey() {
        const meta = state.analysis?.metadata || {};
        return `weekly-report:${meta.className || ""}:${meta.period || ""}:${meta.testDate || ""}`;
      }

      function hydrateSavedComments() {
        try {
          const saved = JSON.parse(localStorage.getItem(storageKey()) || "{}");
          state.statuses = saved.statuses || {};
          (state.analysis.students || []).forEach((student) => {
            if (saved.comments?.[student.name]) {
              student.comments = { ...student.comments, ...saved.comments[student.name] };
            }
          });
        } catch {
          state.statuses = {};
        }
      }

      function normalizeTeacherMemoPlacement() {
        (state.analysis?.students || []).forEach((student) => {
          const comments = student.comments || {};
          const teacherMemo = String(student.teacherMemo || "").trim();
          const summary = String(comments.summary || "");
          const memoMatch = summary.match(/\s*담당\s*메모\s*:\s*(.+)$/);
          const memoText = teacherMemo || (memoMatch ? memoMatch[1].trim() : "");

          if (memoMatch) {
            comments.summary = summary.slice(0, memoMatch.index).trim();
          } else if (teacherMemo && summary.includes(teacherMemo)) {
            comments.summary = summary.replace(teacherMemo, "").replace(/\s*담당\s*메모\s*:\s*$/, "").trim();
          }

          if (memoText) {
            const memoSentence = `담당 메모를 반영해 ${memoText} 부분을 함께 점검하겠습니다.`;
            const nextAction = String(comments.nextAction || "").trim();
            if (!nextAction.includes(memoText) && !nextAction.includes("담당 메모")) {
              comments.nextAction = `${nextAction} ${memoSentence}`.trim();
            }
          }
        });
      }

      function persistAll() {
        if (!state.analysis) return;
        const comments = {};
        state.analysis.students.forEach((student) => {
          comments[student.name] = student.comments;
        });
        localStorage.setItem(storageKey(), JSON.stringify({ comments, statuses: state.statuses }));
      }

      function currentStudent() {
        return state.analysis?.students?.[state.currentIndex] || null;
      }

      function visibleStudents() {
        const students = (state.analysis?.students || []).map((student, index) => ({ student, index }));
        const search = state.filters.search.trim().toLowerCase();
        const filtered = students.filter(({ student }) => {
          const status = statusLabel(student.name);
          const overall = student.analysis?.overallStatus || "";
          const clinic = student.metrics?.clinicParticipation || "";
          if (search && !student.name.toLowerCase().includes(search)) return false;
          if (state.filters.status && status !== state.filters.status) return false;
          if (state.filters.overall && overall !== state.filters.overall) return false;
          if (state.filters.clinic && clinic !== state.filters.clinic) return false;
          return true;
        });
        const sorters = {
          accuracyAsc: (a, b) => (a.student.metrics?.accuracy ?? 0) - (b.student.metrics?.accuracy ?? 0),
          homeworkAsc: (a, b) => (a.student.metrics?.homeworkAverage ?? 0) - (b.student.metrics?.homeworkAverage ?? 0),
          nameAsc: (a, b) => a.student.name.localeCompare(b.student.name, "ko"),
          original: (a, b) => a.index - b.index,
        };
        return filtered.sort(sorters[state.filters.sort] || sorters.original);
      }

      function statusLabel(name) {
        return state.statuses[name] || "검토 필요";
      }

      function statusClass(label) {
        if (label === "저장 완료") return "saved";
        if (label === "수정됨") return "edited";
        if (label === "출력 완료") return "exported";
        return "";
      }

      function renderAll() {
        renderStudentList();
        renderEditor();
        renderReport();
        updateButtons();
      }

      function renderStudentList() {
        const list = $("studentList");
        list.innerHTML = "";
        const students = state.analysis?.students || [];
        visibleStudents().forEach(({ student, index }) => {
          const btn = document.createElement("button");
          btn.className = `student-item ${index === state.currentIndex ? "active" : ""}`;
          btn.innerHTML = `
            <span>
              <span class="student-name">${escapeHtml(student.name)}</span>
              <span class="student-sub">${escapeHtml(student.analysis.overallStatus)} · ${student.metrics.accuracy}% · 숙제 ${student.metrics.homeworkAverage}%</span>
            </span>
            <span class="status ${statusClass(statusLabel(student.name))}">${statusLabel(student.name)}</span>
          `;
          btn.addEventListener("click", () => {
            saveEditorToState(false);
            state.currentIndex = index;
            renderAll();
          });
          list.appendChild(btn);
        });
        const saved = Object.values(state.statuses).filter((value) => value === "저장 완료" || value === "출력 완료").length;
        const visible = visibleStudents().length;
        $("savePill").textContent = `${saved}/${students.length || 0} 저장${students.length && visible !== students.length ? ` · ${visible}명 표시` : ""}`;
      }

      function renderEditor() {
        const student = currentStudent();
        Object.values(commentFields).forEach((field) => {
          field.disabled = !student;
          field.value = "";
        });
        if (!student) return;
        Object.entries(commentFields).forEach(([key, field]) => {
          field.value = student.comments[key] || "";
        });
        const courseType = student.metrics?.courseType || state.analysis?.metadata?.courseType || fields.courseType.value || "내신";
        $("clinicCommentLabel").textContent = courseType === "정규" ? "모의고사 코멘트" : "클리닉 코멘트";
        $("editToast").textContent = `${student.name} 학생 코멘트를 검수 중입니다.`;
      }

      function saveEditorToState(markEdited = true) {
        const student = currentStudent();
        if (!student) return;
        Object.entries(commentFields).forEach(([key, field]) => {
          student.comments[key] = field.value.trim();
        });
        const courseType = student.metrics?.courseType || state.analysis?.metadata?.courseType || fields.courseType.value || "내신";
        if (courseType === "정규") {
          student.comments.mockExamComment = commentFields.clinicComment.value.trim();
        }
        if (markEdited && statusLabel(student.name) !== "저장 완료") {
          state.statuses[student.name] = "수정됨";
        }
      }

      Object.values(commentFields).forEach((field) => {
        field.addEventListener("input", () => {
          saveEditorToState(true);
          renderReport();
          renderStudentList();
        });
      });

      Object.values(fields).forEach((field) => {
        field.addEventListener("input", () => {
          applyMetadataFieldsToAnalysis();
          renderReport();
        });
        field.addEventListener("change", () => {
          applyMetadataFieldsToAnalysis();
          renderReport();
        });
      });

      function setCourseType(value) {
        fields.courseType.value = value;
        document.querySelectorAll(".course-tab").forEach((tab) => {
          tab.classList.toggle("active", tab.dataset.courseType === value);
        });
        if (!state.analysis) {
          fields.reportTitle.value = value === "정규" ? "정규반 수능 주간 학습 리포트" : "경기외고2 내신 성취 분석 리포트";
        }
        applyMetadataFieldsToAnalysis();
        renderReport();
      }

      document.querySelectorAll(".course-tab").forEach((tab) => {
        tab.addEventListener("click", () => setCourseType(tab.dataset.courseType));
      });

      filterFields.search.addEventListener("input", () => {
        state.filters.search = filterFields.search.value;
        renderStudentList();
      });

      ["status", "overall", "clinic", "sort"].forEach((key) => {
        filterFields[key].addEventListener("change", () => {
          state.filters[key] = filterFields[key].value;
          renderStudentList();
        });
      });

      function renderReport(target = $("reportRoot"), student = currentStudent()) {
        if (!student || !state.analysis) {
          target.classList.remove("polished", "a4-report", "concept-report");
          target.innerHTML = '<div class="empty">엑셀을 업로드하거나 샘플을 불러오면 리포트가 표시됩니다.</div>';
          return;
        }
        target.className = "report-page concept-report";
        const meta = state.analysis.metadata || {};
        const metrics = student.metrics;
        const comments = student.comments;
        const domainEntries = Object.entries(metrics.domainAccuracy || {});
        const allQuestions = student.questions || [];
        const questions = allQuestions.slice(0, 22);
        const clinicNo = metrics.clinicParticipation === "미참여";
        const clinicSymbol = clinicParticipationSymbol(metrics.clinicParticipation);
        const courseType = metrics.courseType || meta.courseType || "내신";
        const isRegularCourse = courseType === "정규";
        const statusInitial = student.analysis.overallStatus?.includes("집중") ? "D" : student.analysis.overallStatus?.includes("관리") ? "C" : student.analysis.overallStatus?.includes("보통") ? "B" : "A";
        const title = meta.reportTitle || `${meta.className || meta.courseName || "주간"} 학부모 학습 피드백 리포트`;
        const academyName = meta.academy || "정승효 국어연구소";
        const reportWeek = meta.period || meta.testDate || "";
        const lessonScope = metrics.homework?.[1]?.title || metrics.homework?.[0]?.title || meta.testName || "";
        const targetCount = Math.round((metrics.total || 28) * 0.785);

        target.innerHTML = `
          <div class="concept-header">
            <div class="concept-title">${escapeHtml(title)}</div>
          </div>

          <div class="concept-summary">
            <div class="concept-meta">
              <span>학생명</span><strong>${escapeHtml(student.name)}</strong>
              <span>보고 주차</span><strong>${escapeHtml(reportWeek)}</strong>
              <span>수업 범위</span><strong>${escapeHtml(lessonScope)}</strong>
            </div>
            <div class="metric">
              <span>진단평가</span>
              <strong>${metrics.score} / ${metrics.total}</strong>
              <small>반평균 ${metrics.classAverageScore}개 대비 ${metrics.differenceFromClassAverage >= 0 ? "우수" : "보완 필요"}</small>
            </div>
            <div class="metric">
              <span>숙제 수행도</span>
              <strong>${metrics.homeworkAverage}%</strong>
              <small>주간 누적 수행률 기준</small>
            </div>
            <div class="metric">
              <span>종합 상태</span>
              <strong>${escapeHtml(student.analysis.overallStatus || "확인 필요")}</strong>
              <small>오답 복습과 미제출 보완 우선</small>
            </div>
          </div>

          <div class="concept-layout">
            <div>
              <section class="concept-section">
                <h2>종합 평가</h2>
                <div class="concept-body notice">
                  <div class="grade">${statusInitial}</div>
                  <p class="comment">${escapeHtml(comments.summary)}</p>
                </div>
              </section>

              <section class="concept-section">
                <h2>진단평가 비교</h2>
                <div class="concept-body">
                  ${conceptBarRow("학생", metrics.accuracy, `${metrics.score}개`, "red")}
                  ${conceptBarRow("반평균", metrics.classAverageAccuracy, `${metrics.classAverageScore}개`, "blue")}
                  ${conceptBarRow("목표", 78.5, `${targetCount}개`, "green")}
                </div>
              </section>

              <section class="concept-section">
                <h2>숙제 수행도</h2>
                <div class="concept-body">
                  ${conceptHomeworkChart(metrics, state.analysis.students)}
                </div>
              </section>

              <section class="concept-section domain-section">
                <h2>영역별 성취율</h2>
                <div class="concept-body radar">
                  <div class="radar-box">
                    ${conceptRadarChart(domainEntries)}
                    <span class="axis top">${escapeHtml(domainEntries[0]?.[0] || "독해")}</span>
                    <span class="axis right">${escapeHtml(domainEntries[1]?.[0] || "문학")}</span>
                    <span class="axis bottom">${escapeHtml(domainEntries[2]?.[0] || "문법")}</span>
                    <span class="axis left">${escapeHtml(domainEntries[3]?.[0] || "어휘")}</span>
                  </div>
                  <div class="mini-table-wrap">
                    <table class="mini-table">
                      <tr><th>영역</th><th>성취율</th><th>상태</th></tr>
                      ${domainEntries.slice(0, 4).map(([label, value]) => `<tr><td>${escapeHtml(label)}</td><td>${value}%</td><td>${conceptDomainStatus(value)}</td></tr>`).join("")}
                    </table>
                  </div>
                </div>
              </section>

              ${isRegularCourse ? mockExamHomeworkSection(metrics, comments) : `
                <section class="concept-section">
                  <h2>클리닉 참여</h2>
                  <div class="clinic-strip">
                    <span class="clinic-state">
                      <span class="clinic-mark ${clinicNo ? "no" : ""}">${escapeHtml(metrics.clinicParticipation)}</span>
                      <span class="clinic-symbol">${clinicSymbol}</span>
                    </span>
                    <span>${escapeHtml(comments.clinicComment)}</span>
                  </div>
                </section>
              `}
            </div>

            <div>
              <section class="concept-section">
                <h2>문항 분석</h2>
                <div class="concept-body">
                  <table class="questions">
                    <thead>
                      <tr>
                        <th>번호</th>
                        <th>결과</th>
                        <th>영역</th>
                        <th>난이도</th>
                        <th>보완 포인트</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${questions.map((q) => `
                        <tr>
                          <td>${escapeHtml(q.number)}</td>
                          <td class="${q.result === "X" ? "miss" : q.result === "△" ? "focus" : ""}">${escapeHtml(q.result)}</td>
                          <td>${escapeHtml(q.domain)}</td>
                          <td>${escapeHtml(q.difficulty)}</td>
                          <td>${escapeHtml(q.point)}</td>
                        </tr>
                      `).join("")}
                    </tbody>
                  </table>
                </div>
              </section>

              <section class="concept-section feedback-section">
                <h2>학습 피드백</h2>
                <div class="concept-body feedback">
                  <div class="note"><strong>잘한 점</strong><span>${escapeHtml(comments.strength)}</span></div>
                  <div class="note"><strong>보완할 점</strong><span>${escapeHtml(comments.weakness)}</span></div>
                  <div class="note"><strong>다음 학습 방향</strong><span>${escapeHtml(comments.nextAction)}</span></div>
                  <div class="note"><strong>가정 안내</strong><span>${escapeHtml(comments.homeGuide)}</span></div>
                </div>
              </section>
            </div>
          </div>
          <div class="concept-footer">
            <strong class="footer-brand">
              <img class="footer-logo" src="/static/assets/narusya-logo-mark.png" alt="학원 로고" />
              <span>${escapeHtml(academyName)}</span>
            </strong>
          </div>
        `;
      }

      function conceptBarRow(label, value, display, color) {
        const width = Math.max(0, Math.min(100, value));
        return `<div class="bar-row"><strong>${escapeHtml(label)}</strong><div class="track"><div class="fill ${color}" style="width:${width}%"></div></div><strong>${escapeHtml(display)}</strong></div>`;
      }

      function conceptHomeworkChart(metrics, students = []) {
        const homework = metrics.homework || [];
        const first = Number(homework[0]?.rate ?? 0);
        const second = Number(homework[1]?.rate ?? metrics.homeworkAverage ?? 0);
        const average = Number(metrics.homeworkAverage ?? 0);
        const classFirst = averageOf(students.map((student) => student.metrics?.homework?.[0]?.rate));
        const classSecond = averageOf(students.map((student) => student.metrics?.homework?.[1]?.rate));
        const classAverage = averageOf(students.map((student) => student.metrics?.homeworkAverage));
        const groups = [
          { label: "숙제1", student: first, classValue: classFirst },
          { label: "숙제2", student: second, classValue: classSecond },
          { label: "평균", student: average, classValue: classAverage },
        ];
        return `
          <div class="legend homework-legend">
            <span><i class="dot student"></i>학생</span>
            <span><i class="dot class-avg"></i>전체평균</span>
          </div>
          <div class="concept-chart homework-chart">
            ${groups.map((item) => {
              const studentValue = Math.max(0, Math.min(100, item.student));
              const classValue = Math.max(0, Math.min(100, item.classValue));
              const studentHeight = studentValue * 0.82;
              const classHeight = classValue * 0.82;
              return `
                <div class="bars">
                  <div class="bar-stack student" style="--bar-height:${studentHeight}%">
                    <span class="bar-value">${formatPercent(studentValue)}</span>
                    <div class="vbar student" style="height:${studentHeight}%"></div>
                  </div>
                  <div class="bar-stack class-avg" style="--bar-height:${classHeight}%">
                    <span class="bar-value">${formatPercent(classValue)}</span>
                    <div class="vbar class-avg" style="height:${classHeight}%"></div>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
          <div class="chart-labels">
            ${groups.map((item) => `<span>${escapeHtml(item.label)}</span>`).join("")}
          </div>
        `;
      }

      function averageOf(values) {
        const nums = values.map(Number).filter((value) => Number.isFinite(value));
        if (!nums.length) return 0;
        return Math.round((nums.reduce((sum, value) => sum + value, 0) / nums.length) * 10) / 10;
      }

      function formatPercent(value) {
        return Number.isInteger(value) ? `${value}%` : `${value.toFixed(1)}%`;
      }

      function conceptDomainStatus(value) {
        if (value >= 70) return "양호";
        if (value >= 55) return "기초 유지";
        if (value >= 40) return "보완";
        return "집중";
      }

      function clinicParticipationSymbol(value) {
        if (value === "참여") return "O";
        if (value === "미참여") return "X";
        return "-";
      }

      function mockExamHomeworkSection(metrics, comments) {
        const mock = metrics.mockExamHomework || {};
        const status = mock.status || "-";
        const scoreText = mock.score ? `${escapeHtml(mock.score)}점` : "";
        const gradeText = mock.grade ? `${escapeHtml(mock.grade)}등급` : "";
        const detail = scoreText && gradeText ? `${scoreText}(${gradeText})` : scoreText || gradeText;
        const mockLabel = status === "O" && detail ? detail : status === "O" ? "참여" : status === "X" ? "미참여" : "해당없음";
        return `
          <div class="split-mini-sections">
            <section class="concept-section">
              <h2>클리닉</h2>
              <div class="clinic-strip mock-exam">
                <span class="mock-pair">
                  <span class="mock-value">${escapeHtml(metrics.clinicParticipation)}</span>
                </span>
              </div>
            </section>
            <section class="concept-section">
              <h2>모의고사</h2>
              <div class="clinic-strip mock-exam">
                <span class="mock-pair">
                  <span class="mock-value">${escapeHtml(mockLabel)}</span>
                </span>
              </div>
            </section>
          </div>
        `;
      }

      function conceptRadarChart(domainEntries) {
        const values = [0, 1, 2, 3].map((index) => Number(domainEntries[index]?.[1] ?? 0));
        const center = 63;
        const maxRadius = 43;
        const angles = [-90, 0, 90, 180];
        const point = (value, angle) => {
          const radius = maxRadius * Math.max(0, Math.min(100, value)) / 100;
          const radian = (Math.PI / 180) * angle;
          return `${(center + Math.cos(radian) * radius).toFixed(1)},${(center + Math.sin(radian) * radius).toFixed(1)}`;
        };
        const grid = [25, 50, 75, 100]
          .map((rate) => {
            const radius = maxRadius * rate / 100;
            const points = angles
              .map((angle) => {
                const radian = (Math.PI / 180) * angle;
                return `${(center + Math.cos(radian) * radius).toFixed(1)},${(center + Math.sin(radian) * radius).toFixed(1)}`;
              })
              .join(" ");
            return `<polygon points="${points}" fill="none" stroke="#dfe4eb" stroke-width="1" />`;
          })
          .join("");
        const axes = angles
          .map((angle) => {
            const radian = (Math.PI / 180) * angle;
            return `<line x1="${center}" y1="${center}" x2="${(center + Math.cos(radian) * maxRadius).toFixed(1)}" y2="${(center + Math.sin(radian) * maxRadius).toFixed(1)}" stroke="#e5e7eb" stroke-width="1" />`;
          })
          .join("");
        const points = values.map((value, index) => point(value, angles[index])).join(" ");
        return `
          <svg class="radar-svg" viewBox="0 0 126 126" aria-label="영역별 성취율 그래프">
            ${grid}
            ${axes}
            <polygon points="${points}" fill="rgba(37, 99, 169, 0.16)" stroke="#2563a9" stroke-width="2" />
            ${values.map((value, index) => {
              const [x, y] = point(value, angles[index]).split(",");
              return `<circle cx="${x}" cy="${y}" r="2.2" fill="#2563a9" />`;
            }).join("")}
          </svg>
        `;
      }

      function barLine(label, value) {
        const colorClass = value < 40 ? "red" : value >= 70 ? "green" : "";
        return `<div class="bar-line"><strong>${escapeHtml(label)}</strong><div class="track"><div class="fill ${colorClass}" style="width:${Math.max(0, Math.min(100, value))}%"></div></div><span>${value}%</span></div>`;
      }

      function miniBar(value) {
        const width = Math.max(0, Math.min(100, value));
        return `<div class="track"><div class="fill" style="width:${width}%"></div></div>`;
      }

      function columnChart(entries, classAverage) {
        const values = entries.length ? entries : [["하", 0], ["중", 0], ["상", 0]];
        return `
          <div class="column-chart">
            ${values.map(([, value]) => `
              <div class="bar-pair">
                <div class="vbar" style="height:${Math.max(2, Math.min(100, value))}%"></div>
                <div class="vbar avg" style="height:${Math.max(2, Math.min(100, classAverage))}%"></div>
              </div>
            `).join("")}
          </div>
          <div class="chart-label-row">${values.map(([label]) => `<span>${escapeHtml(label)}</span>`).join("")}</div>
          <div class="legend-row"><span><i class="legend-dot"></i>학생</span><span><i class="legend-dot avg"></i>반평균</span></div>
        `;
      }

      function homeworkChart(metrics) {
        const homework = metrics.homework || [];
        return `
          <div class="homework-bars">
            ${homework.map((item, index) => `
              <div class="homework-row">
                <strong>${index + 1}주차</strong>
                <div class="track"><div class="fill ${item.rate < 40 ? "red" : item.rate >= 80 ? "green" : ""}" style="width:${Math.max(0, Math.min(100, item.rate))}%"></div></div>
                <span>${item.rate}%</span>
              </div>
            `).join("")}
            <div class="homework-row">
              <strong>평균</strong>
              <div class="track"><div class="fill ${metrics.homeworkAverage < 40 ? "red" : metrics.homeworkAverage >= 80 ? "green" : ""}" style="width:${Math.max(0, Math.min(100, metrics.homeworkAverage))}%"></div></div>
              <span>${metrics.homeworkAverage}%</span>
            </div>
          </div>
        `;
      }

      function updateButtons() {
        const hasData = Boolean(state.analysis?.students?.length);
        ["saveBtn", "pngBtn", "printOneBtn", "printAllBtn", "zipAllBtn", "xlsxBtn"].forEach((id) => {
          $(id).disabled = !hasData;
        });
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function safeName(value) {
        return String(value || "report").replace(/[\\/:*?"<>|\\s]+/g, "_").replace(/^_+|_+$/g, "");
      }

      function downloadBlob(blob, filename) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        URL.revokeObjectURL(a.href);
        a.remove();
      }

      async function exportCurrentPng() {
        if (!window.html2canvas) {
          alert("PNG 출력 라이브러리를 불러오지 못했습니다. 브라우저 인쇄를 사용해 주세요.");
          return;
        }
        saveEditorToState(false);
        renderReport();
        const student = currentStudent();
        const scratch = document.createElement("div");
        scratch.style.position = "fixed";
        scratch.style.left = "-20000px";
        scratch.style.top = "0";
        const page = document.createElement("div");
        page.className = "report-page";
        scratch.appendChild(page);
        document.body.appendChild(scratch);
        renderReport(page, student);
        const canvas = await html2canvas(page, { scale: 2, backgroundColor: "#ffffff" });
        scratch.remove();
        canvas.toBlob((blob) => {
          downloadBlob(blob, `${safeName(state.analysis.metadata.period)}_${safeName(student.name)}_리포트.png`);
          state.statuses[student.name] = "출력 완료";
          persistAll();
          renderStudentList();
        });
      }

      async function exportAllZip() {
        if (!window.html2canvas || !window.JSZip) {
          alert("전체 PNG ZIP 라이브러리를 불러오지 못했습니다.");
          return;
        }
        saveEditorToState(false);
        const zip = new JSZip();
        const scratch = document.createElement("div");
        scratch.style.position = "fixed";
        scratch.style.left = "-20000px";
        scratch.style.top = "0";
        document.body.appendChild(scratch);
        for (const student of state.analysis.students) {
          const page = document.createElement("div");
          page.className = "report-page";
          scratch.appendChild(page);
          renderReport(page, student);
          const canvas = await html2canvas(page, { scale: 2, backgroundColor: "#ffffff" });
          const blob = await new Promise((resolve) => canvas.toBlob(resolve));
          zip.file(`${safeName(state.analysis.metadata.period)}_${safeName(student.name)}_리포트.png`, blob);
          state.statuses[student.name] = "출력 완료";
          page.remove();
        }
        scratch.remove();
        const zipBlob = await zip.generateAsync({ type: "blob" });
        downloadBlob(zipBlob, `${safeName(state.analysis.metadata.period)}_전체_리포트_PNG.zip`);
        persistAll();
        renderStudentList();
      }

      function printStudents(students) {
        saveEditorToState(false);
        const root = $("printRoot");
        root.className = "print-root";
        root.innerHTML = "";
        students.forEach((student) => {
          const page = document.createElement("div");
          page.className = "report-page";
          root.appendChild(page);
          renderReport(page, student);
        });
        window.print();
        setTimeout(() => {
          root.className = "report-batch";
          root.innerHTML = "";
        }, 500);
      }

      function exportResultXlsx() {
        if (!window.XLSX) {
          downloadBlob(new Blob([JSON.stringify(state.analysis, null, 2)], { type: "application/json" }), "weekly-report-analysis.json");
          return;
        }
        saveEditorToState(false);
        const rows = state.analysis.students.map((s) => ({
          보고기간: state.analysis.metadata.period,
          수업유형: s.metrics.courseType || state.analysis.metadata.courseType || "내신",
          수업명: state.analysis.metadata.courseName,
          반이름: state.analysis.metadata.className,
          이름: s.name,
          학교: s.school,
          학년: s.grade,
          정답률: s.metrics.accuracy,
          반평균정답률: s.metrics.classAverageAccuracy,
          반평균대비: s.metrics.differenceFromClassAverage,
          숙제평균: s.metrics.homeworkAverage,
          클리닉참여: s.metrics.clinicParticipation,
          모의고사숙제: s.metrics.mockExamHomework?.status || "",
          모의고사점수: s.metrics.mockExamHomework?.score || "",
          모의고사등급: s.metrics.mockExamHomework?.grade || "",
          종합상태: s.analysis.overallStatus,
          취약영역: (s.analysis.weakDomains || []).join(", "),
          강점영역: (s.analysis.strongDomains || []).join(", "),
          우선복습문항: (s.analysis.priorityQuestions || []).join(", "),
          최종_종합평가: s.comments.summary,
          최종_가정안내: s.comments.homeGuide,
          검수상태: statusLabel(s.name),
        }));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), "주간요약");
        XLSX.writeFile(wb, `${safeName(state.analysis.metadata.period)}_주간결과.xlsx`);
      }

      $("analyzeBtn").addEventListener("click", async () => {
        const file = $("file").files[0];
        if (!file) {
          $("uploadToast").textContent = "엑셀 파일을 선택해 주세요.";
          return;
        }
        try {
          await analyzeFile(file);
        } catch (error) {
          $("uploadToast").textContent = error.message;
        }
      });

      $("file").addEventListener("change", () => {
        $("fileName").textContent = $("file").files[0]?.name || "선택된 파일 없음";
      });

      $("loadSampleBtn").addEventListener("click", async () => {
        try {
          await loadSample();
          $("fileName").textContent = "샘플 데이터";
        } catch (error) {
          $("uploadToast").textContent = error.message;
        }
      });

      $("saveBtn").addEventListener("click", () => {
        const student = currentStudent();
        if (!student) return;
        saveEditorToState(false);
        state.statuses[student.name] = "저장 완료";
        persistAll();
        renderAll();
        $("editToast").textContent = `${student.name} 학생 코멘트를 저장했습니다.`;
      });

      $("pngBtn").addEventListener("click", exportCurrentPng);
      $("zipAllBtn").addEventListener("click", exportAllZip);
      $("printOneBtn").addEventListener("click", () => printStudents([currentStudent()]));
      $("printAllBtn").addEventListener("click", () => printStudents(state.analysis.students));
      $("xlsxBtn").addEventListener("click", exportResultXlsx);
    </script>
  </body>
</html>
